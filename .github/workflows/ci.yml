name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # CI NEVER calls the live Deribit API — it runs only against committed snapshot
    # fixtures under data/snapshots/. (Deribit etiquette; a project rule.)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned dependencies (project + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Tests with coverage
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

      - name: Coverage gate (>= 90% on src/ engines)
        run: |
          coverage report --fail-under=90
