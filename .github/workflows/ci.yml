name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # CI NEVER calls the live Deribit API — it runs only against committed snapshot
    # fixtures under data/snapshots/. (Deribit etiquette, CLAUDE.md hard rule.)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy==2.5.1 scipy==1.18.0 pandas==3.0.5 matplotlib==3.11.1 \
            hypothesis==6.165.2 pytest==9.1.1 coverage==7.15.4 ruff==0.16.1 requests==2.34.2

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests with coverage
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

      - name: Coverage gate (>= 90% on src/ engines)
        run: |
          coverage report --fail-under=90
